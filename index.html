<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قيم تجربتك معنا</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 text-center space-y-6">
        
        <!-- الهيدر والترحيب -->
        <div>
            <h2 class="text-2xl font-bold text-gray-800">رأيك يهمنا جداً! ⭐</h2>
            <p class="text-gray-500 mt-2 text-sm">كيف كانت تجربتك معنا اليوم؟</p>
        </div>

        <!-- اختيار النجوم -->
        <div id="stars-container" class="flex justify-center space-x-2 space-x-reverse text-4xl cursor-pointer">
            <span onclick="rate(1)" class="hover:scale-125 transition">⭐</span>
            <span onclick="rate(2)" class="hover:scale-125 transition">⭐</span>
            <span onclick="rate(3)" class="hover:scale-125 transition">⭐</span>
            <span onclick="rate(4)" class="hover:scale-125 transition">⭐</span>
            <span onclick="rate(5)" class="hover:scale-125 transition">⭐</span>
        </div>

        <!-- نموذج الشكاوى الداخلي -->
        <form id="complaint-form" onsubmit="submitComplaint(event)" class="hidden text-right space-y-4 pt-4 border-t">
            <h3 class="font-bold text-red-600 text-sm">أسفون لتجربتك! يرجى إخبارنا بما حدث لنعالجه فوراً:</h3>
            
            <div>
                <label class="text-xs text-gray-600 block mb-1">الاسم (اختياري)</label>
                <input type="text" id="client-name" class="w-full p-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div>
                <label class="text-xs text-gray-600 block mb-1">رقم الهاتف (للتواصل ومعالجة الأمر)</label>
                <input type="tel" id="client-phone" required class="w-full p-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div>
                <label class="text-xs text-gray-600 block mb-1">تفاصيل المشكلة</label>
                <textarea id="client-message" required rows="3" class="w-full p-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
            </div>

            <button type="submit" class="w-full bg-red-600 text-white font-bold py-2 rounded-lg text-sm hover:bg-red-700 transition">إرسال للمدير مباشرة</button>
        </form>

        <!-- بطاقة المكافأة والكوبون عند الانتهاء -->
        <div id="reward-box" class="hidden p-4 bg-green-50 border border-green-200 rounded-xl space-y-2">
            <h4 class="font-bold text-green-700 text-base">🎉 شكراً لتعاونك معنا!</h4>
            <p class="text-xs text-gray-600">تقديرًا لوقتك، احصل على هدية خاصة في زيارتك القادمة:</p>
            <div class="bg-white border border-dashed border-green-500 py-2 px-4 rounded-lg font-mono font-bold text-lg text-green-600 tracking-wider" id="coupon-code">
                GIFT-15OFF
            </div>
            <p class="text-[10px] text-gray-400">يرجى إبراز هذا الكود للموظف عند الدفع</p>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
