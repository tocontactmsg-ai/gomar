<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قيم تجربتك معنا</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Cairo', sans-serif; }
        .star-btn { transition: all 0.2s ease-in-out; }
        .star-btn:hover { transform: scale(1.2); filter: drop-shadow(0px 0px 8px rgba(250, 204, 21, 0.8)); }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-6 text-center space-y-6 border border-slate-100 relative overflow-hidden">
        
        <!-- الهيدر والترحيب -->
        <div id="main-header">
            <h2 class="text-2xl font-black text-slate-800 tracking-wide">رأيك يهمنا جداً! ⭐</h2>
            <p class="text-slate-500 mt-2 text-xs font-medium">كيف كانت تجربتك معنا اليوم؟ اختر التقييم المناسب:</p>
        </div>

        <!-- نظام النجوم -->
        <div id="stars-container" class="space-y-3 py-2">
            <div class="flex justify-between items-center max-w-xs mx-auto text-3xl sm:text-4xl cursor-pointer dir-ltr">
                <button onclick="rate(1)" class="star-btn focus:outline-none p-1" title="سيء جداً">⭐</button>
                <button onclick="rate(2)" class="star-btn focus:outline-none p-1" title="سيء">⭐</button>
                <button onclick="rate(3)" class="star-btn focus:outline-none p-1" title="مقبول">⭐</button>
                <button onclick="rate(4)" class="star-btn focus:outline-none p-1" title="جيد جداً">⭐</button>
                <button onclick="rate(5)" class="star-btn focus:outline-none p-1" title="ممتاز">⭐</button>
            </div>
            <div class="flex justify-between max-w-xs mx-auto text-[10px] font-bold text-slate-400 px-1">
                <span>1 - سيء</span>
                <span>3 - متوسط</span>
                <span>5 - ممتاز</span>
            </div>
        </div>

        <!-- نموذج الشكاوى الداخلي -->
        <form id="complaint-form" onsubmit="submitComplaint(event)" class="hidden text-right space-y-4 pt-4 border-t">
            <h3 class="font-bold text-rose-600 text-xs leading-relaxed">نعتذر جداً عن أي تقصير! يرجى إخبارنا بما حدث لمعالجته فوراً:</h3>
            
            <div>
                <label class="text-[11px] text-slate-600 font-bold block mb-1">الاسم (اختياري)</label>
                <input type="text" id="client-name" class="w-full p-2.5 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-rose-500 outline-none">
            </div>

            <div>
                <label class="text-[11px] text-slate-600 font-bold block mb-1">رقم الهاتف (للتواصل ومعالجة الأمر)</label>
                <input type="tel" id="client-phone" required class="w-full p-2.5 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-rose-500 outline-none">
            </div>

            <div>
                <label class="text-[11px] text-slate-600 font-bold block mb-1">تفاصيل المشكلة</label>
                <textarea id="client-message" required rows="3" class="w-full p-2.5 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-rose-500 outline-none"></textarea>
            </div>

            <button type="submit" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded-xl text-xs transition shadow-md">إرسال الشكوى للإدارة المباشرة</button>
        </form>

        <!-- بطاقة المكافأة أو التقدير القابلة للتخصيص (Dynamic Card) -->
        <div id="reward-box" class="hidden space-y-4">
            
            <div id="coupon-card" class="p-6 text-white rounded-2xl space-y-3 shadow-xl relative overflow-hidden text-center border-2 transition-all">
                <div id="card-icon" class="text-4xl drop-shadow-md">🎁</div>
                <h4 id="card-title" class="font-black text-lg tracking-wide">بطاقة خصم خاصة</h4>
                <p id="card-desc" class="text-xs leading-relaxed font-medium">احصل على خصم خاص على زيارتك القادمة!</p>

                <div id="coupon-code-text" class="bg-white/95 backdrop-blur border-2 border-dashed py-3 px-4 rounded-xl text-slate-900 font-mono font-black text-2xl tracking-widest shadow-inner">
                    VIP-######
                </div>
                <p id="card-footer" class="text-[10px] opacity-90">يرجى إبراز المرجع للموظف عند الزيارة</p>
            </div>

            <button id="download-btn" onclick="downloadAndRedirect()" class="w-full font-extrabold py-3.5 px-4 rounded-2xl text-xs transition shadow-lg flex items-center justify-center gap-2 text-white">
                <span>📸</span> تنزيل البطاقة ومتابعة الخدمة
            </button>

            <p id="download-status" class="text-[11px] font-bold hidden">جاري الحفظ والمعالجة... 🚀</p>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
